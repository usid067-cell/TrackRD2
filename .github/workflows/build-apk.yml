
name: Build TrackRDX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TrackRDX-Android.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          mkdir project
          unzip TrackRDX-Android.zip -d project

      - name: Build APK with Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          build-root-directory: project
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackRDX-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
